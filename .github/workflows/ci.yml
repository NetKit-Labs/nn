name: ci

on:
  workflow_dispatch:

jobs:
  unix:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
          - os: macos-latest
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DNN_ENABLE_WERROR=ON -DNN_REQUIRE_RUNTIMES=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Runtimes linked
        run: |
          ./build/nn backends
          ./build/nn backends | grep -i onnxruntime
          ./build/nn backends | grep -i litert

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DNN_ENABLE_WERROR=ON -DNN_REQUIRE_RUNTIMES=ON
      - name: Build
        run: cmake --build build --config Release -j
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Runtimes linked
        shell: bash
        run: |
          ./build/Release/nn.exe backends
          ./build/Release/nn.exe backends | grep -i onnxruntime
          ./build/Release/nn.exe backends | grep -i litert

  sanitizer:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DNN_ENABLE_WERROR=ON -DNN_SANITIZER=address,undefined
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  fuzz:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DNN_ENABLE_WERROR=ON -DNN_BUILD_FUZZERS=ON -DNN_ENABLE_ONNXRUNTIME=OFF -DNN_ENABLE_LITERT_RUNTIME=OFF
      - name: Build fuzzers
        run: cmake --build build -j --target fuzz_onnx fuzz_gguf fuzz_safetensors fuzz_tflite fuzz_cli
      - name: Smoke fuzzers
        run: |
          ./build/fuzz_onnx -runs=32
          ./build/fuzz_gguf -runs=32
          ./build/fuzz_safetensors -runs=32
          ./build/fuzz_tflite -runs=32
          ./build/fuzz_cli -runs=32
