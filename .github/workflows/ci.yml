name: ci

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: linux ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DNN_ENABLE_WERROR=ON -DNN_REQUIRE_RUNTIMES=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Runtimes linked
        run: |
          ./build/nn backends
          ./build/nn backends | grep -i onnxruntime
          ./build/nn backends | grep -i litert

  sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DNN_ENABLE_WERROR=ON -DNN_SANITIZER=address,undefined
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DNN_ENABLE_WERROR=ON -DNN_BUILD_FUZZERS=ON -DNN_ENABLE_ONNXRUNTIME=OFF -DNN_ENABLE_LITERT_RUNTIME=OFF
      - name: Build fuzzers
        run: cmake --build build -j --target fuzz_onnx fuzz_gguf fuzz_safetensors fuzz_tflite fuzz_cli
      - name: Smoke fuzzers
        run: |
          ./build/fuzz_onnx -runs=32
          ./build/fuzz_gguf -runs=32
          ./build/fuzz_safetensors -runs=32
          ./build/fuzz_tflite -runs=32
          ./build/fuzz_cli -runs=32
